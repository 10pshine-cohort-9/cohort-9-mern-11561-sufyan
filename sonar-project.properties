# This must match the project key you just created
sonar.projectKey=notes-app

# This tells SonarQube to scan everything in your current folder
sonar.sources=.

# More aggressive exclusions to prevent freezing
sonar.exclusions=**/node_modules/**, **/build/**, **/dist/**, **/coverage/**, **/package-lock.json, **/public/**, **/.scannerwork/**, **/*.test.js, **/*.test.jsx
sonar.test.inclusions=**/*.test.js,**/*.test.jsx

# Point SonarQube to your backend and frontend test coverage reports
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Skip tsconfig lookup to prevent analyzer freezing
sonar.typescript.skipTsConfig=true

# Limit CPU threads to prevent Docker memory spikes/crashes
sonar.scanner.maxCpu=4
